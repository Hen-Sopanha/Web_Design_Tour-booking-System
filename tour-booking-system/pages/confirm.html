<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Complete Your Payment</title>
        <link
          rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        />
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
          }

          :root {
            --background: #ffffff;
            --foreground: #171717;
            --blue-100: #dbeafe;
            --blue-300: #93c5fd;
            --blue-500: #3b82f6;
            --blue-600: #2563eb;
            --blue-icon: #4c8ce4;
            --gray-300: #d1d5db;
            --gray-500: #6b7280;
          }

          body {
            background: var(--background);
            color: var(--foreground);
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
          }

          /* ── Navbar ── */
          .navbar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            padding: 4px 24px;
            background: #fff;
          }

          .navbar .logo img {
            width: 96px;
          }

          .navbar .nav-btn {
            justify-self: end;
          }

          .btn-customize {
            cursor: pointer;
            padding: 8px 12px;
            background: var(--blue-600);
            color: #fff;
            border: none;
            border-radius: 9999px;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s;
          }

          .btn-customize:hover {
            background: var(--blue-300);
          }

          /* ── Page header ── */
          .page-header {
            padding: 20px;
            background: var(--blue-500);
          }

          .page-header h1 {
            font-weight: 700;
            color: #fff;
          }

          /* ── Main grid ── */
          .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin: 20px;
          }

          @media (min-width: 1024px) {
            .main-grid {
              grid-template-columns: 1fr 1fr;
            }
          }

          /* ── Booking Summary card ── */
          .booking-card {
            background: var(--blue-100);
            border: 1px solid var(--gray-300);
            border-radius: 6px;
          }

          .booking-card h2 {
            font-weight: 700;
            color: #000;
            margin: 12px 8px;
          }

          .booking-body {
            border-top: 2px solid #000;
          }

          /* shared row */
          .row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-top: 1px solid var(--gray-500);
          }

          .row:first-child {
            border-top: none;
          }

          /* location row – slightly bigger icon */
          .row-location {
            gap: 8px;
            padding: 8px 12px;
          }

          .row-location .icon-loc {
            font-size: 2.2rem;
            color: var(--blue-icon);
            flex-shrink: 0;
          }

          .row-location .loc-text h1 {
            font-size: 1rem;
            font-weight: 600;
            color: #000;
          }

          .row-location .loc-text p {
            font-size: 13px;
            font-weight: 600;
            color: #000;
          }

          .icon-sm {
            font-size: 1.4rem;
            color: #000;
            flex-shrink: 0;
            width: 28px;
            text-align: center;
          }

          .row p {
            font-size: 13px;
            font-weight: 600;
            color: #000;
          }

          /* price rows */
          .row-price {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-top: 1px solid var(--gray-500);
          }

          .row-price .left {
            display: flex;
            align-items: center;
            gap: 8px;
          }

          .row-price p {
            font-size: 13px;
            font-weight: 600;
            color: #000;
          }

          @media (min-width: 640px) {
            .row-price p {
              font-size: 14px;
            }
          }

          /* total row */
          .row-total {
            display: flex;
            padding: 16px 12px;
            border-top: 1px solid var(--gray-500);
          }

          .row-total .label {
            width: 50%;
          }

          .row-total .label h1 {
            font-size: 18px;
            font-weight: 600;
            color: #000;
          }

          .row-total .value {
            width: 50%;
            align-self: center;
          }

          .row-total .value p {
            font-size: 18px;
            font-weight: 600;
            color: #000;
            text-align: right;
          }

          /* ── Payment Methods section ── */
          .payment-section {
            background: var(--blue-100);
            border: 1px solid var(--gray-300);
            border-radius: 6px;
          }
          .payment-section h2 {
            font-weight: 700;
            color: #000;
            margin: 12px 8px;
          }
          .payment-body{
            border-top: 2px solid #000;
          }

          .credit-card p {
            font-size: 18px;
            font-weight: 500;
            color: #000;
            padding-left: 200px;
            padding-top: 20px;
          }
        </style>
      </head>
      <body>
        <!-- Navbar -->
        <div class="navbar">
          <section class="logo">
            <a href="/">
              <img
                src="/tour-booking-system/assets/images/Camtravel Logo.png"
                alt="Logo"
              />
            </a>
          </section>
          <section class="nav-btn">
              <button class="btn-customize">Customize My Tour</button>
          </section>
        </div>

        <!-- Page Header -->
        <div class="page-header">
          <h1>Complete Your Payment</h1>
        </div>

        <!-- Main Content -->
        <div class="main-grid">
          <!-- Booking Summary -->
          <section class="booking-card">
            <h2>BOOKING SUMMARY</h2>
            <div class="booking-body">
              <!-- Location -->
              <div class="row row-location">
                <div>
                  <i class="fa-solid fa-location-dot icon-loc"></i>
                </div>
                <div class="loc-text">
                  <h1>Kampot Adventure</h1>
                  <p>Cambodia, Kampot</p>
                </div>
              </div>

              <!-- Group -->
              <div class="row">
                <i class="fa-solid fa-user-group icon-sm"></i>
                <p>2 Adults, 1 Child</p>
              </div>

              <!-- Date -->
              <div class="row">
                <i class="fa-solid fa-calendar icon-sm"></i>
                <p>Date: 15-April-2026</p>
              </div>

              <!-- Adult price -->
              <div class="row-price">
                <div class="left">
                  <i class="fa-solid fa-dollar-sign icon-sm"></i>
                  <p>$ 50 per adult x1</p>
                </div>
                <p>USD 50</p>
              </div>

              <!-- Child price -->
              <div class="row-price">
                <div class="left">
                  <i class="fa-solid fa-dollar-sign icon-sm"></i>
                  <p>$ 25 per child x1</p>
                </div>
                <p>USD 25</p>
              </div>

              <!-- Total -->
              <div class="row-total">
                <div class="label">
                  <h1>Total Cost:</h1>
                </div>
                <div class="value">
                  <p>USD 75</p>
                </div>
              </div>
            </div>
          </section>

          <!-- Payment Methods -->
          <section class="payment-section">
            <h2>PAYMENT METHODS</h2>
            <div class="payment-body">
              <!-- Credit Card -->
              <div class="credit-card">
                <p>Credit Card</p>
              </div>
            </div>
          </section>
        </div>
      </body>
    </html>
  </body>
</html>
