<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complete Your Payment</title>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- External CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./../styles/base.css" />
    <link rel="stylesheet" href="./../styles/components.css" />
    <link rel="stylesheet" href="./../styles/layout.css" />
    <link rel="stylesheet" href="./../styles/pages.css" />
    <link rel="stylesheet" href="./../styles/responsive.css" />

    <!-- Page-specific styles -->
    <style>
      /* ── Page header ── */
      .page-header {
        padding: 20px;
        background: #3b82f6;
      }
      .page-header h1 {
        font-weight: 700;
        color: #fff;
      }

      /* ── Main grid ── */
      .main-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        margin: 20px;
      }
      @media (min-width: 1024px) {
        .main-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      /* ── Booking Summary card ── */
      .booking-card {
        background: #dbeafe;
        border: 1px solid #d1d5db;
        border-radius: 6px;
      }
      .booking-card h2 {
        font-weight: 700;
        color: #000;
        margin: 12px 8px;
      }
      .booking-body {
        border-top: 2px solid #000;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-top: 1px solid #6b7280;
      }
      .row:first-child {
        border-top: none;
      }

      .row-location {
        gap: 8px;
        padding: 8px 12px;
      }
      .row-location .icon-loc {
        font-size: 2.2rem;
        color: #4c8ce4;
        flex-shrink: 0;
      }
      .row-location .loc-text h1 {
        font-size: 1rem;
        font-weight: 600;
        color: #000;
      }
      .row-location .loc-text p {
        font-size: 13px;
        font-weight: 600;
        color: #000;
      }

      .icon-sm {
        font-size: 1.4rem;
        color: #000;
        flex-shrink: 0;
        width: 28px;
        text-align: center;
      }
      .row p {
        font-size: 13px;
        font-weight: 600;
        color: #000;
      }

      .row-price {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        border-top: 1px solid #6b7280;
      }
      .row-price .left {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .row-price p {
        font-size: 13px;
        font-weight: 600;
        color: #000;
      }

      .row-total {
        display: flex;
        padding: 16px 12px;
        border-top: 1px solid #6b7280;
      }
      .row-total .label {
        width: 50%;
      }
      .row-total .label h1 {
        font-size: 18px;
        font-weight: 600;
        color: #000;
      }
      .row-total .value {
        width: 50%;
        align-self: center;
      }
      .row-total .value p {
        font-size: 18px;
        font-weight: 600;
        color: #000;
        text-align: right;
      }

      /* ── Payment Methods ── */
      .payment-section {
        background: #dbeafe;
        border: 1px solid #d1d5db;
        border-radius: 6px;
      }
      .payment-section h2 {
        font-weight: 700;
        color: #000;
        margin: 12px 8px;
      }
      .payment-body {
        border-top: 2px solid #000;
      }

      .payment-option {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid #d1d5db;
        cursor: pointer;
        font-size: 16px;
        font-weight: 500;
        color: #000;
      }
      .payment-option input[type="radio"] {
        width: 18px;
        height: 18px;
        accent-color: #6c7fc4;
        flex-shrink: 0;
      }
      .payment-option span {
        flex: 1;
      }
      .payment-option .logos {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: auto;
      }
      .payment-option .logos img {
        height: 28px;
        object-fit: contain;
      }
      .payment-option .logos img[alt="Apple Pay"] {
        height: 44px;
        width: auto;
        margin: -8px 0;
        object-fit: contain;
        max-width: 80px;
      }
      .btn-continue {
        display: block;
        width: calc(100% - 32px);
        margin: 16px;
        padding: 14px;
        background: #a0aec0;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        letter-spacing: 1px;
        transition: background 0.2s;
      }
      .btn-continue:hover {
        background: #6c7fc4;
      }

      .request-section {
        margin: 0 20px 20px 20px;
        background: #dbeafe;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        padding: 16px;
        grid-column: 1 / -1; /* spans all columns */
      }

      .request-section h2 {
        font-weight: 700;
        color: #000;
        margin-bottom: 12px;
        text-align: center;
        align-self: center;
      }

      .request-section textarea {
        width: 100%;
        min-height: 100px;
        padding: 12px;
        background: #e2e8f0;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        color: #555;
        resize: vertical;
        font-family: inherit;
      }

      .request-section textarea:focus {
        outline: none;
        background: #cbd5e1;
      }
    </style>
  </head>

  <body>
    <!-- Page Header -->
    <div class="page-header">
      <h1>Complete Your Payment</h1>
    </div>

    <!-- Main Content -->
    <div class="main-grid">
      <!-- Booking Summary -->
      <section class="booking-card">
        <h2>BOOKING SUMMARY</h2>
        <div class="booking-body">
          <div class="row row-location">
            <div><i class="fa-solid fa-location-dot icon-loc"></i></div>
            <div class="loc-text">
              <h1>Kampot Adventure</h1>
              <p>Cambodia, Kampot</p>
            </div>
          </div>

          <div class="row">
            <i class="fa-solid fa-user-group icon-sm"></i>
            <p>2 Adults, 1 Child</p>
          </div>

          <div class="row">
            <i class="fa-solid fa-calendar icon-sm"></i>
            <p>Date: 15-April-2026</p>
          </div>

          <div class="row-price">
            <div class="left">
              <i class="fa-solid fa-dollar-sign icon-sm"></i>
              <p>$ 50 per adult x1</p>
            </div>
            <p>USD 50</p>
          </div>

          <div class="row-price">
            <div class="left">
              <i class="fa-solid fa-dollar-sign icon-sm"></i>
              <p>$ 25 per child x1</p>
            </div>
            <p>USD 25</p>
          </div>

          <div class="row-total">
            <div class="label"><h1>Total Cost:</h1></div>
            <div class="value"><p>USD 75</p></div>
          </div>
        </div>
      </section>

      <!-- Payment Methods -->
      <section class="payment-section">
        <h2>PAYMENT METHODS</h2>
        <div class="payment-body">
          <label class="payment-option">
            <input type="radio" name="payment" value="credit-card" />
            <span>Credit Card</span>
            <div class="logos">
              <img src="../assets/logo/Visa-Logo.jpg" alt="Visa" />
              <img src="../assets/logo/Mastercard-Logo.png" alt="Mastercard" />
            </div>
          </label>

          <label class="payment-option">
            <input type="radio" name="payment" value="aba" />
            <span>ABA Bank</span>
            <div class="logos">
              <img src="../assets/logo/Aba-Logo.png" alt="ABA" />
            </div>
          </label>

          <label class="payment-option">
            <input type="radio" name="payment" value="alipay" />
            <span>Alipay</span>
            <div class="logos">
              <img src="../assets/logo/Alipay-Logo.png" alt="Alipay" />
            </div>
          </label>

          <label class="payment-option">
            <input type="radio" name="payment" value="applepay" />
            <span>Apple Pay</span>
            <div class="logos">
              <img src="../assets/logo/ApplePay-Logo.png" alt="Apple Pay" />
            </div>
          </label>

          <label class="payment-option">
            <input type="radio" name="payment" value="paypal" />
            <span>PayPal</span>
            <div class="logos">
              <img src="../assets/logo/Paypal-Logo.png" alt="PayPal" />
            </div>
          </label>

          <button class="btn-continue">CONTINUE</button>
        </div>
      </section>
      <div class="request-section">
        <h2>CUSTOMER REQUESTS</h2>
        <textarea
          id="customer-request"
          placeholder="Dietary requirements, allergies, room preferences, pickup location, or any special requests..."
        >
        </textarea>
      </div>
    </div>
    <script>
      document
        .querySelector(".btn-continue")
        .addEventListener("click", function () {
          const selected = document.querySelector(
            'input[name="payment"]:checked',
          );

          if (!selected) {
            alert("Please select a payment method first.");
            return;
          }

          localStorage.setItem("selectedPayment", selected.value);
          window.location.href = "confirm2.html";
        });
    </script>
  </body>
</html>
