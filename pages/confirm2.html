<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Details</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./../styles/base.css" />
    <link rel="stylesheet" href="./../styles/components.css" />
    <link rel="stylesheet" href="./../styles/layout.css" />
    <link rel="stylesheet" href="./../styles/pages.css" />
    <link rel="stylesheet" href="./../styles/responsive.css" />

    <style>
      /* page header */
      .page-header {
        padding: 20px;
        background: #3b82f6;
      }
      .page-header h1 {
        font-weight: 700;
        color: #fff;
      }

      /* main layout */
      .main-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        margin: 20px;
      }
      @media (min-width: 1024px) {
        .main-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      /* booking summary (same as confirm page) */
      .booking-card {
        background: #dbeafe;
        border: 1px solid #d1d5db;
        border-radius: 6px;
      }
      .booking-card h2 {
        font-weight: 700;
        color: #000;
        margin: 12px 8px;
      }
      .booking-body {
        border-top: 2px solid #000;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-top: 1px solid #6b7280;
      }
      .row:first-child {
        border-top: none;
      }
      .row-location {
        gap: 8px;
        padding: 8px 12px;
      }
      .row-location .icon-loc {
        font-size: 2.2rem;
        color: #4c8ce4;
        flex-shrink: 0;
      }
      .row-location .loc-text h1 {
        font-size: 1rem;
        font-weight: 600;
        color: #000;
      }
      .row-location .loc-text p {
        font-size: 13px;
        font-weight: 600;
        color: #000;
      }
      .icon-sm {
        font-size: 1.4rem;
        color: #000;
        flex-shrink: 0;
        width: 28px;
        text-align: center;
      }
      .row p {
        font-size: 13px;
        font-weight: 600;
        color: #000;
      }
      .row-price {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        border-top: 1px solid #6b7280;
      }
      .row-price .left {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .row-price p {
        font-size: 13px;
        font-weight: 600;
        color: #000;
      }
      .row-total {
        display: flex;
        padding: 16px 12px;
        border-top: 1px solid #6b7280;
      }
      .row-total .label {
        width: 50%;
      }
      .row-total .label h1 {
        font-size: 18px;
        font-weight: 600;
        color: #000;
      }
      .row-total .value {
        width: 50%;
        align-self: center;
      }
      .row-total .value p {
        font-size: 18px;
        font-weight: 600;
        color: #000;
        text-align: right;
      }

      /* right panel */
      .payment-panel {
        background: #dbeafe;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* selected method display */
      .selected-method {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: #fff;
        border: 2px solid #6c7fc4;
        border-radius: 8px;
      }
      .selected-method img {
        height: 28px;
        object-fit: contain;
      }
      .selected-method span {
        font-weight: 600;
        font-size: 15px;
      }

      /* card details form */
      .card-form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .card-form h2 {
        font-weight: 700;
        font-size: 16px;
        color: #000;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 2px solid #000;
        padding-bottom: 8px;
        margin-bottom: 4px;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .form-group label {
        font-size: 13px;
        font-weight: 600;
        color: #374151;
      }
      .form-group input {
        padding: 10px 14px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 14px;
        background: #fff;
        font-family: inherit;
        transition: border-color 0.2s;
      }
      .form-group input:focus {
        outline: none;
        border-color: #6c7fc4;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      /* logos on card number row */
      .input-with-logos {
        position: relative;
      }
      .input-with-logos input {
        width: 100%;
        padding-right: 90px;
      }
      .input-logos {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .input-logos img {
        height: 22px;
        object-fit: contain;
      }

      /* qr / redirect panels */
      .qr-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 20px;
        background: #fff;
        border-radius: 8px;
        text-align: center;
      }
      .qr-panel img.qr-logo {
        height: 60px;
        object-fit: contain;
      }
      .qr-placeholder {
        width: 160px;
        height: 160px;
        background: #e2e8f0;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: #6b7280;
      }
      .qr-panel p {
        font-size: 13px;
        color: #6b7280;
        max-width: 220px;
        line-height: 1.5;
      }

      /* buttons */
      .btn-pay {
        width: 100%;
        padding: 14px;
        background: #6c7fc4;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        letter-spacing: 1px;
        transition: background 0.2s;
      }
      .btn-pay:hover {
        background: #4a5f9e;
      }
      .btn-back {
        width: 100%;
        padding: 12px;
        background: #a0aec0;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-back:hover {
        background: #718096;
      }
      .request-section {
        margin: 0 20px 20px 20px;
        background: #dbeafe;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        padding: 16px;
        grid-column: 1 / -1; /* spans all columns */
      }

      .request-section {
        margin: 0 20px 20px 20px;
        background: #dbeafe;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        padding: 16px;
        grid-column: 1 / -1; /* spans all columns */
      }

      .request-section h2 {
        font-weight: 700;
        color: #000;
        margin-bottom: 12px;
        text-align: center;
        align-self: center;
      }

      .request-section textarea {
        width: 100%;
        min-height: 100px;
        padding: 12px;
        background: #e2e8f0;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        color: #555;
        resize: vertical;
        font-family: inherit;
      }

      .request-section textarea:focus {
        outline: none;
        background: #cbd5e1;
      }
    </style>
  </head>
  <body>
    
    <!-- Page Header -->
     <div id="header-root"></div>
    <div class="page-header">
      <h1 id="page-title">Enter Payment Details</h1>
    </div>

    <!-- Main Content -->
    <div class="main-grid">
      <!-- Booking Summary (same as confirm page) -->
      <section class="booking-card">
        <h2>BOOKING SUMMARY</h2>
        <div class="booking-body">
          <div class="row row-location">
            <div><i class="fa-solid fa-location-dot icon-loc"></i></div>
            <div class="loc-text">
              <h1>Kampot Adventure</h1>
              <p>Cambodia, Kampot</p>
            </div>
          </div>

          <div class="row">
            <i class="fa-solid fa-user-group icon-sm"></i>
            <p>2 Adults, 1 Child</p>
          </div>

          <div class="row">
            <i class="fa-solid fa-calendar icon-sm"></i>
            <p>Date: 15-April-2026</p>
          </div>

          <div class="row-price">
            <div class="left">
              <i class="fa-solid fa-dollar-sign icon-sm"></i>
              <p>$ 50 per adult x1</p>
            </div>
            <p>USD 50</p>
          </div>

          <div class="row-price">
            <div class="left">
              <i class="fa-solid fa-dollar-sign icon-sm"></i>
              <p>$ 25 per child x1</p>
            </div>
            <p>USD 25</p>
          </div>

          <div class="row-total">
            <div class="label"><h1>Total Cost:</h1></div>
            <div class="value"><p>USD 75</p></div>
          </div>
        </div>
      </section>

      <!-- Payment Panel -->
      <section class="payment-panel">
        <!-- Shows which method was selected -->
        <div class="selected-method" id="selected-method-display">
          <span id="method-name">Loading...</span>
        </div>

        <!-- Form area - changes based on payment method -->
        <div id="payment-form-area"></div>

        <!-- Back button -->
        <button
          class="btn-back"
          onclick="window.location.href = 'confirm.html'"
        >
          BACK
        </button>
      </section>
      <div class="request-section">
        <h2>CUSTOMER REQUESTS</h2>
        <textarea
          id="customer-request"
          placeholder="Dietary requirements, allergies, room preferences, pickup location, or any special requests..."
        >
        </textarea>
      </div>
    </div>
    <script>
      // payment method info
      const methods = {
        "credit-card": {
          name: "Credit Card",
          logos: [
            "../assets/logo/Visa-Logo.jpg",
            "../assets/logo/Mastercard-Logo.png",
          ],
          type: "card",
        },
        aba: {
          name: "ABA Bank",
          logos: ["../assets/logo/Aba-Logo.png"],
          type: "aba",
        },
        alipay: {
          name: "Alipay",
          logos: ["../assets/logo/Alipay-Logo.png"],
          type: "qr",
        },
        applepay: {
          name: "Apple Pay",
          logos: ["../assets/logo/ApplePay-Logo.png"],
          type: "card",
        },
        paypal: {
          name: "PayPal",
          logos: ["../assets/logo/Paypal-Logo.png"],
          type: "qr",
        },
      };

      // read selected payment from localStorage
      const selected = localStorage.getItem("selectedPayment") || "credit-card";
      const method = methods[selected];

      // update page title
      document.getElementById("page-title").textContent =
        "Enter " + method.name + " Details";

      // update selected method display
      const methodDisplay = document.getElementById("selected-method-display");
      methodDisplay.innerHTML = `
        <span>${method.name}</span>
        ${method.logos.map((src) => `<img src="${src}" alt="${method.name}" />`).join("")}
      `;

      // render correct form based on type
      const formArea = document.getElementById("payment-form-area");

      if (method.type === "card") {
        // credit card / apple pay form
        formArea.innerHTML = `
          <div class="card-form">
            <h2>Enter Card Details</h2>

            <div class="form-group">
              <label>Card Number</label>
              <div class="input-with-logos">
                <input type="text" placeholder="0000 0000 0000 0000" maxlength="19" id="card-number" />
                <div class="input-logos">
                  ${method.logos.map((src) => `<img src="${src}" />`).join("")}
                </div>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Expiry Date</label>
                <input type="text" placeholder="MM / YY" maxlength="7" id="expiry" />
              </div>
              <div class="form-group">
                <label>CVV</label>
                <input type="password" placeholder="123" maxlength="4" id="cvv" />
              </div>
            </div>

            <div class="form-group">
              <label>Cardholder Name</label>
              <input type="text" placeholder="Enter full name as shown on card" id="card-name" />
            </div>

            <button class="btn-pay" onclick="handlePay()">Pay USD 75</button>
          </div>
        `;

        // auto format card number with spaces
        document
          .getElementById("card-number")
          .addEventListener("input", function () {
            let val = this.value.replace(/\D/g, "").substring(0, 16);
            this.value = val.match(/.{1,4}/g)?.join(" ") || val;
          });

        // auto format expiry
        document
          .getElementById("expiry")
          .addEventListener("input", function () {
            let val = this.value.replace(/\D/g, "").substring(0, 4);
            if (val.length >= 2)
              val = val.substring(0, 2) + " / " + val.substring(2);
            this.value = val;
          });
      } else if (method.type === "qr") {
        // alipay / paypal - show QR or redirect message
        formArea.innerHTML = `
          <div class="qr-panel">
            <img class="qr-logo" src="${method.logos[0]}" alt="${method.name}" />
            <p>You will be redirected to <strong>${method.name}</strong> to complete your payment securely.</p>
            <div class="qr-placeholder">
              <span>QR Code Here</span>
            </div>
            <p>Scan the QR code with your ${method.name} app or click the button below.</p>
            <button class="btn-pay" onclick="handlePay()">Pay USD 75 via ${method.name}</button>
          </div>
        `;
      } else if (method.type === "aba") {
        // ABA - no card input needed, just confirm
        formArea.innerHTML = `
          <div class="qr-panel">
            <img class="qr-logo" src="${method.logos[0]}" alt="ABA Bank" />
            <p>You will be redirected to <strong>ABA Bank</strong> internet banking to complete your payment.</p>
            <div class="qr-placeholder">
              <span>QR Code Here</span>
            </div>
            <p>Or open your ABA Mobile app and scan the code above.</p>
            <button class="btn-pay" onclick="handlePay()">Pay USD 75 via ABA</button>
          </div>
        `;
      }

      // handle pay button
      function handlePay() {
        if (method.type === "card") {
          const number = document
            .getElementById("card-number")
            .value.replace(/\s/g, "");
          const expiry = document.getElementById("expiry").value;
          const cvv = document.getElementById("cvv").value;
          const name = document.getElementById("card-name").value;

          if (number.length < 16 || !expiry || cvv.length < 3 || !name) {
            alert("Please fill in all card details correctly.");
            return;
          }
        }

        alert("Payment successful! Thank you for your booking.");
        // later: redirect to confirmation/success page
      }
    </script>
    <div id="footer-root"></div>

    <!-- Scripts -->
    <script src="./../js/components/header.js"></script>
    <script src="./../js/components/footer.js"></script>
    <script src="./../js/utils.js"></script>
    <script src="./../js/main.js"></script>
    <script src="./../js/pages/tourDetails.js"></script>
  </body>
</html>
