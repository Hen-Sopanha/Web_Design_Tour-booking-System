<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Custom Tour | CamTravel</title>
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/pages.css">
    <link rel="stylesheet" href="../styles/responsive.css">
    <style>
        .thank-you-container {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 1.5rem;
            background-color: #f8fafc;
        }

        .thank-you-card {
            background: white;
            padding: 3.5rem 2rem;
            border-radius: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #f0fdf4;
            color: #22c55e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
        }

        .thank-you-card h1 {
            color: #0f172a;
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .thank-you-card p {
            color: #64748b;
            font-size: 1.125rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .thank-you-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn-primary {
            background: #1A6FDB;
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: #1557ad;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 111, 219, 0.2);
        }
    </style>
</head>

<body>
    <main class="thank-you-container">
        <div class="thank-you-card">
            <div class="success-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="none" viewBox="0 0 24 24"
                    stroke-width="2.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                </svg>
            </div>
            <h1>Request Received!</h1>
            <p>Thank you for choosing CamTravel. Our travel experts are already crafting your personalized Cambodia
                adventure. We'll be in touch within 24 hours.</p>

            <div class="thank-you-actions">
                <a href="index.html" class="btn-primary">Back to Homepage</a>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const dest = params.get('destination');

            if (dest) {
                const destNames = {
                    kampot: 'Kampot',
                    sihanoukville: 'Sihanoukville',
                    battambang: 'Battambang',
                    siemreap: 'Siem Reap',
                    kohkong: 'Koh Kong',
                    kep: 'Kep'
                };

                const destName = destNames[dest.toLowerCase()] || dest;
                const message = document.querySelector('.thank-you-card p');
                message.innerHTML = `Thank you for choosing CamTravel. Our travel experts are already crafting your personalized adventure to <strong>${destName}</strong>. We'll be in touch within 24 hours.`;
            }
        });
    </script>
    <script src="../js/main.js"></script>
    <script src="../js/components/header.js"></script>
    <script src="../js/components/footer.js"></script>
</body>

</html>
